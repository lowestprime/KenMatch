    <stop offset=".5" stop-color="#b08d1a"/>
    <stop offset=".75" stop-color="#991b1b"/>
    <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="30" y1="67" x2="68" y2="29" gradientUnits="userSpaceOnUse">
