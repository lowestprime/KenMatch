<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc" focusable="false" shape-rendering="geometricPrecision">
  <title id="title">KenMatch Science &amp; Health category icon — dark</title>
  <desc id="desc">A precise double helix representing biological mechanism discovery, health research, and scientific translation.</desc>
  <defs>
    <linearGradient id="brand" x1="11" y1="85" x2="85" y2="11" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1d4ed8"/>
